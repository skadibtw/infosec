name: CI

on: [push, pull_request]

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt bandit
      - name: SAST (bandit)
        run: bandit -r . -x ./.venv
      - uses: actions/cache@v4
        with:
          path: ~/dependency-check/data
          key: dependency-check-${{ github.run_id }}
          restore-keys: dependency-check-
      - name: SCA (OWASP Dependency-Check)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          curl -sL https://github.com/dependency-check/DependencyCheck/releases/download/v12.2.2/dependency-check-12.2.2-release.zip -o dc.zip
          unzip -q dc.zip -d ~
          mkdir -p dependency-check-report
          ~/dependency-check/bin/dependency-check.sh -s requirements.txt --project lab1 \
            --enableExperimental --disableOssIndex --failOnCVSS 7 \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"} -f HTML -f JSON -o dependency-check-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: lab1/dependency-check-report
